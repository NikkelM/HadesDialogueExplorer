[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
extend-exclude = ["dist", "outputs"]

# Adopt Ruff's pyflakes + pycodestyle-error baseline plus import sorting (I),
# pyupgrade modernizations (UP; the project targets py310), and implicit-Optional
# detection (RUF013). Pinned explicitly rather than relying on Ruff's implicit
# defaults, which shift between releases (0.16 folded many more families in).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF013"]

